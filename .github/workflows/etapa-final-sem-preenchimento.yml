name: Etapa final sem preenchimento
on:
  push:
    paths:
      - '.github/workflows/etapa-final-sem-preenchimento.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deixar botao final sem cor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</style>'
          css='''\n/* Etapa final: indisponivel e sem preenchimento */\n#btnFinal{background:transparent!important;background-image:none!important;color:#a8a8a8!important;border:2px solid #d7d7d7!important;box-shadow:none!important;cursor:not-allowed!important;opacity:.8!important;filter:none!important}\n#btnFinal:hover{background:transparent!important;background-image:none!important;transform:none!important;box-shadow:none!important}\n'''
          if '#btnFinal{background:transparent!important' not in s:
              s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Deixa etapa final sem cor de fundo'
          git push