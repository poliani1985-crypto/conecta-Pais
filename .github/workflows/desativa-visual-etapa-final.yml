name: Desativa visual etapa final
on:
  push:
    paths:
      - '.github/workflows/desativa-visual-etapa-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar botao etapa final
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='🎉 Abrir etapa final'
          new='🔒 Etapa final — desativada'
          if old not in s and new not in s:
              raise SystemExit('Botao etapa final nao encontrado')
          s=s.replace(old,new,1)
          # acrescenta regra visual forte para o botao final existente sem alterar sua logica de liberacao futura
          marker='</style>'
          css='\n/* Etapa final bloqueada durante o periodo de acompanhamento */\n#btnFinal{background:#d9d9d9!important;color:#6b6b6b!important;border-color:#c8c8c8!important;box-shadow:none!important;cursor:not-allowed!important;opacity:1!important}\n'
          if '#btnFinal{background:#d9d9d9!important' not in s and marker in s:
              s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Mostra etapa final como desativada'
          git push