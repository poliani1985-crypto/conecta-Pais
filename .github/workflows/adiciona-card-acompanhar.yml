name: Organiza seis cards da semana
on:
  push:
    paths:
      - '.github/workflows/adiciona-card-acompanhar.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organizar cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          cards='const conteudos=[["👶","Antes de falar, o bebê já conversa!","Nível 0 · Comunicação e linguagem","Descubra como o bebê se comunica por meio do olhar, do sorriso, dos gestos e dos sons — e como essas experiências são valorizadas no CMEI.","nivel0-preview.html"],["🌱","As primeiras palavras estão chegando!","Nível 1 · Comunicação e linguagem","Olhares, gestos, sons e pequenas palavras vão se encontrando. Descubra como acolher e ampliar as tentativas de comunicação da criança.","nivel1-preview.html"],["🧩","Agora tenho muito para contar!","Nível 2 · Comunicação e linguagem","Nas brincadeiras, pequenas falas podem virar grandes conversas. Veja como escutar e ampliar o que a criança tem a dizer.","nivel2-preview.html"],["💬","Deixa eu contar uma coisa?","Nível 3 · Comunicação e linguagem","Perguntas, histórias e muita imaginação! Descubra como a escuta pode ajudar a criança a organizar ideias e ampliar suas conversas.","nivel3-preview.html"],["🌱","Acompanhar também é cuidar","Para todas as famílias · Desenvolvimento infantil","Cada criança tem seu ritmo, mas alguns sinais merecem atenção. Conheça referências para acompanhar o desenvolvimento com informação, cuidado e sem comparações.","acompanhar-desenvolvimento.html"],["🧳","Aconteceu no CMEI","Projeto Maleta Viajante","Uma história que saiu do CMEI e chegou até as famílias. Conheça a experiência da Maleta Viajante e tudo o que existe por trás dessa viagem."]];'
          s,n=re.subn(r'const conteudos=\[.*?\];',cards,s,count=1,flags=re.S)
          if n != 1: raise SystemExit('cards nao encontrados')
          antigo=':i===3?`<img src="ChatGPT%20Image%2015%20de%20set.%20de%202026%2C%2011_13_11.png" alt="Ilustração do Nível 3" style="width:100%;height:170px;object-fit:cover;object-position:center;border-radius:20px;margin-bottom:14px;display:block">`:\'\';'
          novo=':i===3?`<img src="ChatGPT%20Image%2015%20de%20set.%20de%202026%2C%2011_13_11.png" alt="Ilustração do Nível 3" style="width:100%;height:170px;object-fit:cover;object-position:center;border-radius:20px;margin-bottom:14px;display:block">`:i===4?`<img src="ChatGPT%20Image%2015%20de%20set.%20de%202026%2C%2012_26_43.png" alt="Acompanhar também é cuidar" style="width:100%;height:170px;object-fit:cover;object-position:center;border-radius:20px;margin-bottom:14px;display:block">`:i===5?`<img src="ChatGPT%20Image%2015%20de%20set.%20de%202026%2C%2014_05_05.png" alt="Projeto Maleta Viajante - Aconteceu no CMEI" style="width:100%;height:170px;object-fit:cover;object-position:center;border-radius:20px;margin-bottom:14px;display:block">`:\'\';'
          if antigo not in s: raise SystemExit('trecho das imagens nao encontrado')
          s=s.replace(antigo,novo,1)
          s=s.replace("${i<=3?'':", "${i<=5?'':",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Organiza seis cards da semana"
          git push
