name: Conecta bloqueio primeiro acesso

'on':
  push:
    paths:
      - '.github/workflows/conecta-bloqueio-primeiro-acesso.yml'

permissions:
  contents: write

jobs:
  conectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conectar arquivo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="bloqueio-primeiro-acesso.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Salvar alteracao
        run: |
          grep -F 'bloqueio-primeiro-acesso.js' index.html
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add index.html
          git commit -m 'Ativa bloqueio do primeiro acesso duplicado'
          git push
