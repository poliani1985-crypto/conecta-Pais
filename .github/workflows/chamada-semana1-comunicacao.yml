name: Chamada Semana 1 Comunicacao

on:
  push:
    paths:
      - '.github/workflows/chamada-semana1-comunicacao.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Atualizar banner da semana
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<section><div class="banner" style="text-align:center"><h2>📚  Nossa conexão começa aqui 🌼</h2><p>Aqui você encontrará os conteúdos do ConectaPais para acompanhar, aprender e participar.</p></div>'''
          new='''<section><div class="banner" style="text-align:center"><div style="font-size:13px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:8px">💬 Esta semana no ConectaPais</div><h2 style="font-size:30px;margin:4px 0 8px">Comunicação e Linguagem</h2><p style="font-size:18px;font-weight:800;margin:7px 0">A criança se comunica desde o primeiro olhar.</p><p style="max-width:760px;margin:8px auto 12px;line-height:1.5">Nesta semana, vamos descobrir como a comunicação se desenvolve dos primeiros gestos e sons às palavras, conversas e histórias. 💗</p><div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px"><span style="background:rgba(255,255,255,.24);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:800">Níveis 0 • 1 • 2 • 3</span><span style="background:rgba(255,255,255,.24);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:800">👨‍👩‍👧 Conteúdo para as famílias</span><span style="background:rgba(255,255,255,.24);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:800">🏫 Aconteceu no CMEI</span></div></div>'''
          if old not in s:
              raise SystemExit('Banner original nao encontrado; nenhuma alteracao feita.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Salvar alteracao
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza chamada da Semana 1 para Comunicacao e Linguagem"
          git push origin main
