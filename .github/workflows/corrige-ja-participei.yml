name: Corrigir acesso Ja participei

on:
  push:
    paths:
      - '.github/workflows/corrige-ja-participei.yml'

permissions:
  contents: write

jobs:
  corrigir-acesso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Corrigir entrada direta na area de conteudos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          padrao = r"(function\s+entrarSistema\s*\(\s*\)\s*\{.*?)(mostrar\s*\(\s*['\"]principal['\"]\s*\)\s*;)(.*?\n\})"
          novo, n = re.subn(padrao, r"\1abrirPrincipal();\3", s, count=1, flags=re.S)

          if n != 1:
              raise SystemExit('Nao foi possivel localizar mostrar principal dentro de entrarSistema')

          p.write_text(novo, encoding='utf-8')
          PY
      - name: Salvar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corrige Ja participei para montar conteudos" || exit 0
          git push origin main
