<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConectaPais — Conteúdo da 1ª Semana</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="conteudo" title="Conteúdo ConectaPais"></iframe><script>const permitidas=['nivel0-preview.html','nivel1-preview.html','nivel2-preview.html','nivel3-preview.html','acompanhar-desenvolvimento.html','maleta-viajante.html'];const params=new URLSearchParams(location.search);const pagina=params.get('pagina');const frame=document.getElementById('conteudo');if(!permitidas.includes(pagina)){location.replace('semana1-comunicacao.html')}else{frame.src=pagina}frame.addEventListener('load',()=>{try{const caminho=frame.contentWindow.location.pathname.split('/').pop();if(caminho==='index.html'||caminho===''){location.replace('semana1-comunicacao.html')}}catch(e){}});</script></body></html>
