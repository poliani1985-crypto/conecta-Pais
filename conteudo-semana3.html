<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConectaPais — Conteúdo da 3ª Semana</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="conteudo" title="Conteúdo ConectaPais"></iframe><script>const permitidas=["previa-autonomia-nivel0.html","previa-autonomia-nivel1.html","previa-autonomia-nivel2.html","previa-autonomia-nivel3.html","previa-autonomia-acompanhar.html","previa-autonomia-borboletario.html"];const pagina=new URLSearchParams(location.search).get('pagina');const frame=document.getElementById('conteudo');if(!permitidas.includes(pagina)){location.replace('semana3-autonomia.html')}else{frame.src=pagina}frame.addEventListener('load',()=>{try{const caminho=frame.contentWindow.location.pathname.split('/').pop();if(caminho==='index.html'||caminho===''){location.replace('semana3-autonomia.html')}}catch(e){}});</script></body></html>
